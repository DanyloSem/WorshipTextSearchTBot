# Змінні середовища: TELEGRAM_TOKEN, PCO_CLIENT_ID, PCO_SECRET (або через .env).
# Локальна база пісень — SQLite у каталозі data/; синхронізація з PCO при старті та за розкладом 3/6/9/12.
# Volume data/ потрібен для збереження songs.db (read-write).
# Образ бота збирається з Dockerfile і містить JRE (Java) для LanguageTool.
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worship-lyrics-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: '1'
      DATA_PATH: /worship_text_tbot/data/songs.db
    volumes:
      - ./data:/worship_text_tbot/data
    # Для webhook-режиму розкоментуйте порт та додайте WEBHOOK_URL у .env
    # ports:
    #   - "8080:8080"
