# Змінні середовища: TELEGRAM_TOKEN, PCO_CLIENT_ID, PCO_SECRET (або через .env).
# Локальна база пісень — SQLite у каталозі data/; синхронізація з PCO при старті та за розкладом 3/6/9/12.
# Volume data/ потрібен для збереження songs.db (read-write).
# Образ бота збирається з Dockerfile і містить JRE (Java) для LanguageTool.
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worship-lyrics-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: '1'
      DATA_PATH: /worship_text_tbot/data/songs.db
    volumes:
      - ./data:/worship_text_tbot/data
    ports:
      - "8080:8080"
    # За замовчуванням — webhook-режим (run_webhook.py). Для polling замініть на: command: ["python3", "run.py"] і закоментуйте ports вище.
    command: ["python3", "run_webhook.py"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: worship-lyrics-cloudflared
    restart: unless-stopped
    env_file:
      - .env
    command: ['tunnel', '--no-autoupdate', 'run', '--token', '${CF_TUNNEL_TOKEN}']
    depends_on:
      - bot
